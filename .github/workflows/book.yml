name: Book CI

on:
  push:
    branches: [main]
    paths:
      - '00-前言.md'
      - '第一部分-基础篇/**'
      - '第二部分-核心系统篇/**'
      - '第三部分-高级模式篇/**'
      - '第四部分-工程实践篇/**'
      - '附录/**'
      - 'en/**'
      - 'yuyu-book/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/book.yml'
  pull_request:
    paths:
      - '00-前言.md'
      - '第一部分-基础篇/**'
      - '第二部分-核心系统篇/**'
      - '第三部分-高级模式篇/**'
      - '第四部分-工程实践篇/**'
      - '附录/**'
      - 'en/**'
      - 'yuyu-book/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/book.yml'

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - run: python -m pip install -r yuyu-book/requirements.txt

      # Playwright ships as a Python dependency here, so the browser comes from
      # `python -m playwright install`, not `npx playwright`. The build is run
      # without --browser on purpose: only the auto-detected msedge/chrome/
      # chromium launches pass --allow-file-access-from-files, which the mermaid
      # harness needs to import the ESM bundle from file://. Noto CJK faces are
      # required for the printed pages and the diagram labels.
      - name: Install Chromium build, CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m playwright install --with-deps chromium

      - run: python scripts/check_book.py

      - run: npm run check:diagrams

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s yuyu-book/tests -v

      # Also warms yuyu-book/.cache/mermaid so the PDF pass reuses the plates.
      - name: Assemble and audit both editions
        run: python yuyu-book/build.py --check

      - name: Build both PDF editions
        run: python yuyu-book/build.py --lang both --pdf

      - uses: actions/upload-artifact@v4
        with:
          name: yuyu-book-dist
          path: yuyu-book/dist/*
          if-no-files-available: error
