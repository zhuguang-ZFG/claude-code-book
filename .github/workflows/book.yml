name: Book CI
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**.md'
      - 'pi/**'
      - 'opencode/**'
      - 'deepseek/**'
      - 'hermes/**'
      - 'codex/**'
      - 'llm/**'
      - 't3code/**'
      - 'yuyu-book/**'
      - 'scripts/**'
      - 'tests/**'
      - 'video/**'
      - 'docs/**'
      - '.github/**'
      - '*lock*'
      - 'pyproject.toml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: book-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: Fast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - run: node --test opencode/examples/check-review-trace.mjs
      - run: python -m unittest discover -s hermes/examples -p "test_*.py" -v
      - run: python hermes/examples/check_aurora_workflow.py
      - run: python -B codex/examples/check_workshop.py
      - run: python opencode/examples/pricing-lab/check_pricing.py
      - run: python scripts/bookctl.py check --fast
      - name: Static analysis
        run: |
          python -m pip install ruff==0.15.21
          python -m ruff check .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-reports
          path: .scratch/reports/*.json
          if-no-files-found: error
          include-hidden-files: true
  full:
    name: Full
    needs: fast
    # Full stays a main/dispatch tier and renders the Chinese book.
    # Agent volumes below render their own PDF and EPUB on pull requests as well.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - run: python scripts/bookctl.py check --full
      - run: python scripts/check_artifact_claims.py
      - run: python scripts/check_visual_layout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-visual-layout
          path: .scratch/visual-check/*
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yuyu-book-dist
          path: yuyu-book/dist/*
          if-no-files-found: error
  omp:
    name: Omp
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - run: |
          python omp/overhaul/audit_structure.py --check
          python omp/overhaul/audit_delivery.py
          python scripts/bookctl.py build --product omp --check --mermaid source
          python scripts/bookctl.py build --product omp --lang zh --pdf
      - uses: actions/upload-artifact@v4
        with:
          name: yuyu-omp-dist
          path: yuyu-book/dist/yuyu-omp-*
          if-no-files-found: error
  bootstrap:
    name: Bootstrap (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - run: python scripts/bookctl.py doctor
      - run: python scripts/bookctl.py build --check --mermaid source
  pi:
    name: Pi
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - run: python scripts/bookctl.py build --product pi --lang zh --pdf --epub
      - uses: ./.github/actions/epubcheck
        with:
          epub: yuyu-book/dist/yuyu-pi-zh.epub
      - uses: actions/upload-artifact@v4
        with:
          name: yuyu-pi-dist
          path: yuyu-book/dist/yuyu-pi-*
          if-no-files-found: error
  agent-volumes:
    name: Agent volume (${{ matrix.product }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        product: [opencode, deepseek, hermes, codex, prompt, kimi, vibe, llm, t3code]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - name: Build complete Chinese HTML, PDF and EPUB
        run: python scripts/bookctl.py build --product ${{ matrix.product }} --lang zh --pdf --epub
      - name: Check every publication format exists
        shell: bash
        run: |
          for extension in html pdf epub; do
            test -s "yuyu-book/dist/yuyu-${{ matrix.product }}-zh.${extension}"
          done
      - uses: ./.github/actions/epubcheck
        with:
          epub: yuyu-book/dist/yuyu-${{ matrix.product }}-zh.epub
      - name: Package the offline exercises
        if: matrix.product == 'prompt'
        run: python scripts/package_prompt.py --output yuyu-book/dist/yuyu-prompt-zh-examples.zip
      - uses: actions/upload-artifact@v4
        with:
          name: yuyu-${{ matrix.product }}-dist
          path: yuyu-book/dist/yuyu-${{ matrix.product }}-zh*
          if-no-files-found: error
  collected:
    name: Collected edition
    # Twelve bound volumes inline every plate. The quadratic iter_doc scan is
    # already fixed; what remains is a measuring Chromium print, the stamped
    # print, and PyMuPDF garbage=4. A finished local run is about 21 minutes
    # of PDF plus 4 minutes of EPUB. An earlier attempt was killed at 3600s
    # during that print, so pull requests build HTML+EPUB without the costly
    # PDF. Every event still runs EPUBCheck against the exact generated EPUB.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - name: Build the collected HTML, PDF and EPUB
        if: github.event_name != 'pull_request'
        run: python scripts/bookctl.py build --product collected --lang zh --pdf --epub
      - name: Build the collected HTML and EPUB for pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/bookctl.py build --product collected --lang zh --epub
      - uses: ./.github/actions/epubcheck
        with:
          epub: yuyu-book/dist/yuyu-collected-zh.epub
      - name: Check the collected edition exists
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import fitz
          root = Path("yuyu-book/dist")
          html = root / "yuyu-collected-zh.html"
          pdf = root / "yuyu-collected-zh.pdf"
          epub = root / "yuyu-collected-zh.epub"
          for path in (html, epub):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty: {path}")
          print(f"collected html {html.stat().st_size} bytes")
          if pdf.is_file():
              doc = fitz.open(pdf)
              try:
                  pages = doc.page_count
              finally:
                  doc.close()
              if pages < 1:
                  raise SystemExit("collected pdf has no pages")
              print(f"collected pdf {pdf.stat().st_size} bytes, {pages} pages")
          elif os.environ.get("GITHUB_EVENT_NAME") != "pull_request":
              raise SystemExit("collected pdf is missing outside pull requests")
          else:
              print("collected pdf skipped on pull requests")
          print(f"collected epub {epub.stat().st_size} bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yuyu-collected-dist
          path: |
            yuyu-book/dist/yuyu-collected-zh.html
            yuyu-book/dist/yuyu-collected-zh.pdf
            yuyu-book/dist/yuyu-collected-zh.epub
          if-no-files-found: error
  deepseek-components:
    name: DeepSeek Cordis components
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the pinned Cordis source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: fcc0ad462172522aaf5c93a7b2e01f6b9f0b0159
          path: .scratch/deepseek-runtime/pinned-source
          sparse-checkout: vendor/cordis/src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Verify source and example fingerprints
        run: python deepseek/examples/verify-evidence.py --source-root .scratch/deepseek-runtime/pinned-source/vendor/cordis/src
      - name: Install the pinned component dependencies
        run: >-
          npm install --prefix .scratch/deepseek-runtime --ignore-scripts --no-audit --no-fund
          @deepseek-ai/cordis@4.1.0 @deepseek-ai/cosmokit@1.9.0
          @standard-schema/spec@1.1.0 tsx@4.23.13
      - name: Exercise Cordis without a model or full host
        run: >-
          node --import ./.scratch/deepseek-runtime/node_modules/tsx/dist/loader.mjs
          deepseek/examples/check-cordis.mjs
          --source .scratch/deepseek-runtime/pinned-source/vendor/cordis/src/index.ts
      - name: Exercise the complete review plugin lifecycle
        run: >-
          node --import ./.scratch/deepseek-runtime/node_modules/tsx/dist/loader.mjs
          deepseek/examples/check-review-lab.mjs
          --source .scratch/deepseek-runtime/pinned-source/vendor/cordis/src/index.ts
