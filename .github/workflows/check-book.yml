name: 检查书籍内容

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 -m pip install -r yuyu-book/requirements.txt
      - name: Check bilingual chapter structure
        run: python3 docs/yuyu-overhaul/check_bilingual_parity.py
      - run: python3 scripts/bookctl.py check --fast
      - name: Check omp structure and source assembly
        run: |
          python3 omp/overhaul/audit_structure.py --check
          python3 omp/overhaul/audit_delivery.py
          python3 yuyu-book/build.py --manifest manifest-omp.json --sources sources-omp.json --lang zh --check --mermaid source
