name: Pages

on:
  push:
    branches: [main]
    paths:
      - '00-前言.md'
      - '第一部分-基础篇/**'
      - '第二部分-核心系统篇/**'
      - '第三部分-高级模式篇/**'
      - '第四部分-工程实践篇/**'
      - '附录/**'
      - 'en/**'
      - 'yuyu-book/**'
      - 'docs/**'
      - 'omp/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one site at a time: a second push re-runs build, not a racing deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The second volume ships through its own job: a broken omp build must never
  # block the 御舆 deploy, the same rule book.yml follows. continue-on-error
  # keeps the deploy green; the assemble step links the omp card only when the
  # artifact actually arrived.
  omp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - name: Build the omp volume (Chinese HTML)
        run: python scripts/bookctl.py build --product omp --lang zh
      - uses: actions/upload-artifact@v4
        with:
          name: omp-site
          path: yuyu-book/dist/yuyu-omp-zh.html
          if-no-files-found: error
  build:
    needs: omp
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - name: Build the book
        run: python scripts/bookctl.py build --lang zh

      - name: Rebuild every source product twice
        run: python scripts/check_products.py

      # The committed docs/ is what the repository itself shows and what the
      # site contracts quote. A rewrite here means the shipped copy was stale —
      # usually a chapter was edited and the reader was never rebuilt.
      # Windows commits store CRLF; Linux generators write LF. Compare text
      # content, not the line-ending flavour, or every push fails on noise.
      - name: The committed readers match the generators
        run: |
          git diff --ignore-cr-at-eol --exit-code docs/ || {
            echo "::error::docs/ is stale; commit the regenerated readers and gallery"
            git --no-pager diff --ignore-cr-at-eol --stat docs/
            exit 1
          }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: omp-site
          path: omp-dist

      # Assemble the site. 御舆 is the volume that must ship: the omp job may
      # have failed, in which case omp-dist/ is empty and the portal keeps its
      # card unlinked. Both land in the one Pages artifact because Pages
      # deploys a single site per run — that is why omp builds in its own job.
      - name: Assemble the site
        run: |
          mkdir -p site
          cp yuyu-book/dist/yuyu-agent-harness-zh.html site/book.html
          cp yuyu-book/dist/yuyu-agent-harness-zh.html site/yuyu-agent-harness-zh.html
          cp docs/*.html docs/*-index.json docs/*-map.json site/
          cp docs/illustration-prompts.md site/illustration-prompts.md
          cp cover.png site/cover.png
          cp -R docs/images site/images
          if [ -f omp-dist/yuyu-omp-zh.html ]; then
            mkdir -p site/omp
            cp omp-dist/yuyu-omp-zh.html site/omp/
            python scripts/build_site_portal.py site/index.html --omp
          else
            python scripts/build_site_portal.py site/index.html
          fi
          # index.html and portal.html are the same page under two names; the
          # link check requires them byte-identical, so both get the variant.
          cp site/index.html site/portal.html

      - name: Entry points and local links
        run: python scripts/check_site_redirects.py site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
