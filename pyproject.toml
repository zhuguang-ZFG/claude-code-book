[project]
name = "yuyu-book"
version = "0.3.6"
description = "Build and check the Chinese offline edition of 御舆：解码 Agent Harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "CC BY-NC-SA 4.0" }
dependencies = [
    "Markdown==3.11",
    "Pygments==2.20.0",
    "playwright==1.61.0",
    "PyMuPDF==1.28.0",
    "fonttools==4.66.1",
    "Pillow==12.3.0",
    "PyYAML==6.0.3",
]

# The book itself is Markdown plus scripts, not an installed library: uv sync
# installs the toolchain above and leaves the repository layout alone.
[tool.uv]
package = false

# Static checks are a dev convenience, not part of the book's runtime: ruff is
# not a build dependency, so `make lint` is the only thing that needs it.
[tool.ruff]
target-version = "py312"
line-length = 92

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    # scripts and tests put the repository on sys.path before importing the
    # package, so their imports cannot sit at the top of the file
    "E402",
    # Chinese sentences and inline tables are long by nature; the editor still
    # wraps them, the linter has nothing useful to say about the width
    "E501",
]
