  <rect x="540" y="246" width="140" height="86" rx="8"/>
  <text x="610" y="282" text-anchor="middle" font-size="28" fill="currentColor" stroke="none">result</text>
  <text x="610" y="316" text-anchor="middle" font-size="28" fill="currentColor" stroke="none">exit + hash</text>
  <text x="360" y="386" text-anchor="middle" font-size="28" fill="currentColor" stroke="none">Locks, disk space, or bugs can still fail</text>
</svg>

