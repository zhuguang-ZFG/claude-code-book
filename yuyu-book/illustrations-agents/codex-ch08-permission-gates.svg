<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Task authorization, approval, and sandbox capability permit an attempt, but runtime evidence determines whether the side effect succeeded">
  <text x="360" y="46" text-anchor="middle" font-size="30" fill="currentColor" stroke="none">Permission to try is not proof of success</text>
  <rect x="40" y="104" width="130" height="94" rx="8"/>
  <rect x="200" y="104" width="130" height="94" rx="8"/>
