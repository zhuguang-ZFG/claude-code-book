<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-label="按训练顺序合并 token 的字节" class="llm-explainer" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>按训练顺序合并 token 的字节</title><desc>规则 1 到 4 依次产生 en、ken、oken、token，对应新 ID 257 至 260。</desc><text x="200" y="26" text-anchor="middle" font-size="22" fill="currentColor" stroke="none">token 的四次合并</text><text x="200" y="55" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">使用 32 轮训练得到的真实规则</text><text x="200" y="90" text-anchor="middle" font-size="24" fill="currentColor" stroke="none">t   o   k   e   n</text><text x="200" y="120" text-anchor="middle" font-size="20" fill="currentColor" stroke="none">规则 1：e + n → en</text><text x="200" y="145" text-anchor="middle" font-size="16" fill="currentColor" stroke="none">新 ID：257</text><text x="200" y="180" text-anchor="middle" font-size="20" fill="currentColor" stroke="none">规则 2：k + en → ken</text><text x="200" y="205" text-anchor="middle" font-size="16" fill="currentColor" stroke="none">新 ID：258</text><text x="200" y="240" text-anchor="middle" font-size="20" fill="currentColor" stroke="none">规则 3：o + ken → oken</text><text x="200" y="265" text-anchor="middle" font-size="16" fill="currentColor" stroke="none">新 ID：259</text><text x="200" y="300" text-anchor="middle" font-size="20" fill="currentColor" stroke="none">规则 4：t + oken → token</text><text x="200" y="325" text-anchor="middle" font-size="16" fill="currentColor" stroke="none">新 ID：260</text><text x="200" y="366" text-anchor="middle" font-size="16" fill="currentColor" stroke="none">规则 0 合并其他字节，未用于此样本</text></svg>
