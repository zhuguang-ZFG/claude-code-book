<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 424" role="img" aria-label="文本、字节、token ID 与 embedding" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>文本、字节、token ID 与 embedding</title><desc>token 的 UTF-8 字节是 74 6f 6b 65 6e。本章规则合并成 ID 260，再查 embedding 表。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 406V416H18M422 416H432V406"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">同一个样本：从文本到向量</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">UTF-8 字节 → BPE 合并 ID → 查 E 嵌入行</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="26" y="72" width="388" height="58" rx="8" class="il-jade" fill="currentColor" fill-opacity=".07" stroke="none"/><rect x="26" y="72" width="388" height="58" rx="8" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="26" y="79" width="3.5" height="44" rx="1.7" class="il-jade" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="42" y="93" text-anchor="start" font-size="16" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">① 原始文本</text><text x="400" y="93" text-anchor="end" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">5 个 ASCII 字符</text><text x="42" y="119" text-anchor="start" font-size="18" font-weight="700" fill="currentColor" stroke="none">token</text><path pathLength="100" d="M220 131V149m-4.5 -5 4.5 5 4.5 -5" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="150" width="388" height="58" rx="8" class="il-sky" fill="currentColor" fill-opacity=".07" stroke="none"/><rect x="26" y="150" width="388" height="58" rx="8" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="26" y="157" width="3.5" height="44" rx="1.7" class="il-sky" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="42" y="171" text-anchor="start" font-size="16" class="il-sub il-sky" font-weight="700" fill="currentColor" stroke="none">② UTF-8 字节</text><text x="400" y="171" text-anchor="end" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">中文约 3 B/字</text><text x="42" y="197" text-anchor="start" font-size="18" font-weight="700" fill="currentColor" stroke="none">74   6f   6b   65   6e</text><path pathLength="100" d="M220 209V227m-4.5 -5 4.5 5 4.5 -5" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="228" width="388" height="58" rx="8" class="il-bronze" fill="currentColor" fill-opacity=".07" stroke="none"/><rect x="26" y="228" width="388" height="58" rx="8" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="26" y="235" width="3.5" height="44" rx="1.7" class="il-bronze" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="42" y="249" text-anchor="start" font-size="16" class="il-sub il-bronze" font-weight="700" fill="currentColor" stroke="none">③ BPE 规则合并</text><text x="400" y="249" text-anchor="end" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">32 轮后词表 288</text><text x="42" y="275" text-anchor="start" font-size="18" font-weight="700" fill="currentColor" stroke="none">token ID：260</text><path pathLength="100" d="M220 287V305m-4.5 -5 4.5 5 4.5 -5" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="306" width="388" height="58" rx="8" class="il-cinnabar" fill="currentColor" fill-opacity=".07" stroke="none"/><rect x="26" y="306" width="388" height="58" rx="8" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="26" y="313" width="3.5" height="44" rx="1.7" class="il-cinnabar" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="42" y="327" text-anchor="start" font-size="16" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">④ 嵌入表查表</text><text x="400" y="327" text-anchor="end" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">维度 d 随模型而定</text><text x="42" y="353" text-anchor="start" font-size="18" font-weight="700" fill="currentColor" stroke="none">取 E 的第 260 行向量</text><g class="il-bronze-2"><path d="M20 382H211M229 382H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 378.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><text x="220" y="406" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">ID 来自玩具词表；向量值需由模型训练学得</text></svg>
