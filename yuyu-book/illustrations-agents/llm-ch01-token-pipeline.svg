<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-label="文本、字节、token ID 与 embedding" class="llm-explainer" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>文本、字节、token ID 与 embedding</title><desc>token 的 UTF-8 字节是 74 6f 6b 65 6e。本章规则合并成 ID 260，再查 embedding 表。</desc><text x="200" y="26" text-anchor="middle" font-size="21" fill="currentColor" stroke="none">同一个样本，从文本到向量</text><text x="200" y="65" text-anchor="middle" font-size="16" fill="currentColor" stroke="none">文本</text><rect x="50" y="73" width="300" height="32" rx="8"/><text x="200.0" y="95.0" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">token</text><path d="M200 107v12m-5 -5 5 5 5 -5"/><text x="200" y="140" text-anchor="middle" font-size="16" fill="currentColor" stroke="none">UTF-8 字节（十六进制）</text><rect x="50" y="148" width="300" height="32" rx="8"/><text x="200.0" y="170.0" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">74 6f 6b 65 6e</text><path d="M200 182v12m-5 -5 5 5 5 -5"/><text x="200" y="215" text-anchor="middle" font-size="16" fill="currentColor" stroke="none">按本章 BPE 规则合并</text><rect x="50" y="223" width="300" height="32" rx="8"/><text x="200.0" y="245.0" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">token ID：260</text><path d="M200 257v12m-5 -5 5 5 5 -5"/><text x="200" y="290" text-anchor="middle" font-size="16" fill="currentColor" stroke="none">embedding 查表</text><rect x="50" y="298" width="300" height="32" rx="8"/><text x="200.0" y="320.0" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">取 E 的第 260 行</text><text x="200" y="365" text-anchor="middle" font-size="16" fill="currentColor" stroke="none">ID 来自玩具词表；向量值需由模型学习</text></svg>
