8" y="285" width="3.5" height="60" rx="1.7" class="il-cinnabar" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="242" y="300" text-anchor="start" font-size="16" class="il-cinnabar" font-weight="700" fill="currentColor" stroke="none">按点积：B 排第 1</text><text x="242" y="322" text-anchor="start" font-size="16" fill="currentColor" stroke="none">B:6.000 &gt; A:3.000</text><text x="242" y="344" text-anchor="start" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">‖B‖=2.83 拉大点积</text><text x="220" y="380" text-anchor="middle" font-size="16" class="il-sub il-bronze-3" font-weight="700" fill="currentColor" stroke="none">用内积索引做语义检索前，须先做 L2 归一化</text></svg>
