<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 378" role="img" aria-label="第三个查询对三个值加权求和" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif" class="llm-explainer"><title>第三个查询对三个值加权求和</title><desc>查询为零和一。三个键的缩放点积经 softmax 得到权重，再对三个值加权求和，得到零点四八八和零点六四六。</desc><text x="200" y="28" text-anchor="middle" font-size="22" fill="currentColor" stroke="none">第三个查询怎样混合三个值</text><text x="200" y="64" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">q₂ = [0, 1]，缩放后再 softmax</text><text x="65" y="106" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">键</text><text x="170" y="106" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">分数</text><text x="295" y="106" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">权重</text><text x="65" y="145" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">[1, 0]</text><text x="170" y="145" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">0.000</text><text x="295" y="145" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">0.219</text><path d="M210 139h37m-5 -4 5 4 -5 4"/><text x="65" y="190" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">[0.8, 0.6]</text><text x="170" y="190" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">0.424</text><text x="295" y="190" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">0.335</text><path d="M210 184h37m-5 -4 5 4 -5 4"/><text x="65" y="235" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">[0, 1]</text><text x="170" y="235" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">0.707</text><text x="295" y="235" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">0.445</text><path d="M210 229h37m-5 -4 5 4 -5 4"/><path d="M30 255H370"/><text x="200" y="286" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">输出 = 0.219 v₀ + 0.335 v₁ + 0.445 v₂</text><text x="200" y="322" text-anchor="middle" font-size="22" fill="currentColor" stroke="none">≈ [0.488, 0.646]</text><text x="200" y="354" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">权重显示值四舍五入；计算用完整精度</text></svg>
