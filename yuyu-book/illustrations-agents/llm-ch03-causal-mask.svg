<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 375" role="img" aria-label="因果遮罩的三个查询与三个键" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif" class="llm-explainer"><title>因果遮罩的三个查询与三个键</title><desc>行是查询位置，列是键位置。下三角含对角线可见；右上三角为未来，禁止读取。</desc><text x="200" y="28" text-anchor="middle" font-size="22" fill="currentColor" stroke="none">因果遮罩：只读当前与过去</text><text x="240" y="64" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">键的位置 j</text><text x="158" y="94" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">0</text><text x="224" y="94" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">1</text><text x="290" y="94" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">2</text><text x="47" y="140" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">查询 0</text><rect x="126" y="108" width="62" height="54" rx="4"/><circle cx="157" cy="135" r="7" fill="currentColor"/><rect x="192" y="108" width="62" height="54" rx="4"/><path d="M214 126l18 18m0 -18l-18 18"/><rect x="258" y="108" width="62" height="54" rx="4"/><path d="M280 126l18 18m0 -18l-18 18"/><text x="47" y="200" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">查询 1</text><rect x="126" y="168" width="62" height="54" rx="4"/><circle cx="157" cy="195" r="7" fill="currentColor"/><rect x="192" y="168" width="62" height="54" rx="4"/><circle cx="223" cy="195" r="7" fill="currentColor"/><rect x="258" y="168" width="62" height="54" rx="4"/><path d="M280 186l18 18m0 -18l-18 18"/><text x="47" y="260" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">查询 2</text><rect x="126" y="228" width="62" height="54" rx="4"/><circle cx="157" cy="255" r="7" fill="currentColor"/><rect x="192" y="228" width="62" height="54" rx="4"/><circle cx="223" cy="255" r="7" fill="currentColor"/><rect x="258" y="228" width="62" height="54" rx="4"/><circle cx="289" cy="255" r="7" fill="currentColor"/><text x="200" y="320" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">● 可见：j ≤ i</text><text x="200" y="350" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">× 遮住：j &gt; i</text></svg>
