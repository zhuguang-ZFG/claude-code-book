<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 392" role="img" aria-label="因果遮罩的三个查询与三个键" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>因果遮罩的三个查询与三个键</title><desc>行是查询位置，列是键位置。下三角含对角线可见；右上三角为未来，禁止读取。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 374V384H18M422 384H432V374"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">因果遮罩：只读当前与过去</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">3×3 注意力下三角（行=查询 i，列=键 j）</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><text x="268" y="86" text-anchor="middle" font-size="16" class="il-sky" font-weight="700" fill="currentColor" stroke="none">键的位置 j</text><text x="164" y="110" text-anchor="middle" font-size="16" class="il-sub" font-weight="700" fill="currentColor" stroke="none">0 青禾</text><text x="248" y="110" text-anchor="middle" font-size="16" class="il-sub" font-weight="700" fill="currentColor" stroke="none">1 工作坊</text><text x="332" y="110" text-anchor="middle" font-size="16" class="il-sub" font-weight="700" fill="currentColor" stroke="none">2 报名</text><text x="116" y="153" text-anchor="end" font-size="16" class="il-sub" fill="currentColor" stroke="none">查询 0 青禾</text><rect x="126" y="122" width="76" height="52" rx="6" class="il-jade" fill="currentColor" fill-opacity=".16" stroke="none"/><rect x="126" y="122" width="76" height="52" rx="6" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".8"/><circle cx="164" cy="148.0" r="7.5" class="il-jade" fill="currentColor" stroke="none"/><rect x="210" y="122" width="76" height="5