urrentColor" stroke="none">×  j &gt; i 遮蔽（未来 −∞）</text><text x="220" y="372" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">无遮罩时位置 0 偷看未来，输出漂移成 [0.72, 0.43]</text></svg>
