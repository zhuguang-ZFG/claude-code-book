<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-label="RoPE 位置旋转、平移不变性与高低频坐标对" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>RoPE 位置旋转、平移不变性与高低频坐标对</title><desc>左圆显示不同位置 m 与 n 的向量旋转后形成相对夹角；右圆显示两位置同移加Δ后，q' 与 k' 同步旋转 45 度但夹角不变；下方对比 4 维示例高频与低频坐标对的余弦值。</desc><g class="il-bronze-2"><path d="M8 18V8H18M402 8H412V18M8 342V352H18M402 352H412V342" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".55"/><rect x="18" y="64" width="172" height="156" rx="8" fill="currentColor" fill-opacity=".04" stroke="currentColor" stroke-width="1.1" stroke-opacity=".45"/><rect x="230" y="64" width="172" height="156" rx="8" fill="currentColor" fill-opacity=".04" stroke="currentColor" stroke-width="1.1" stroke-opacity=".45"/></g><text x="210" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">RoPE：绝对位置变为相对夹角</text><g class="il-bronze-2"><path d="M20 39H201M219 39H400" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M210 35.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><text x="104" y="56" text-anchor="middle" font-size="15" class="il-sub il-sky" font-weight="700" fill="currentColor" stroke="none">m ≠ n（旋转不同角度）</text><text x="316" y="56" text-anchor="middle" font-size="15" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">同移 +Δ（相对夹角不变）</text><g class="il-muted" fill="none" stroke="currentColor"><circle cx="104" cy="134" r="50" stroke-width="1.2" stroke-dasharray="3 5" opacity=".42"/><path d="M46 134H162M104 76V192" stroke-width="1" opacity=".24"/><circle cx="316" cy="134" r="50" stroke-width="1.2" stroke-dasharray="3 5" opacity=".42"/><path d="M258 134H374M316 76V192" stroke-width="1" opacity=".24"/></g><path pathLength="100" d="M104 134L155.2 125.0M104 134L133.8 91.4" stroke-width="2.2" fill="none" stroke="currentColor"/><circle cx="155.2" cy="125.0" r="4.2" fill="currentColor" stroke="none"/><g class="il-sky" fill="none" stroke="currentColor"><circle cx="133.8" cy="91.4" r="4.2" stroke-width="1.8"/><circle cx="104" cy="134" r="3.4" stroke-width="1.4"/></g><path pathLength="100" d="M123.7 130.5A20 20 0 0 0 115.5 117.6" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="171" y="130" text-anchor="middle" font-size="15" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">q</text><text x="144" y="83" text-anchor="middle" font-size="15" class="il-sub il-sky" font-weight="700" fill="currentColor" stroke="none">k</text><text x="133" y="118" text-anchor="middle" font-size="15" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">φ</text><g class="il-bronze" fill="none" stroke="currentColor"><path pathLength="100" d="M194 114Q210 98 226 114m-5 0 5 0-1-5" stroke-width="1.6"/></g><text x="210" y="94" text-anchor="middle" font-size="15" class="il-sub il-bronze" font-weight="700" fill="currentColor" stroke="none">+Δ</text><path d="M316 134L367.2 125.0M316 134L345.8 91.4" stroke-width="1.5" stroke-dasharray="4 4" opacity=".42" fill="none" stroke="currentColor"/><circle cx="367.2" cy="125.0" r="3.4" fill="currentColor" stroke="none" opacity=".4"/><g fill="none" stroke="currentColor" opacity=".4"><circle cx="345.8" cy="91.4" r="3.4"/></g><path pathLength="100" d="M316 134L345.8 91.4M316 134L307.0 82.8" stroke-width="2.2" fill="none" stroke="currentColor"/><circle cx="345.8" cy="91.4" r="4.2" fill="currentColor" stroke="none"/><g class="il-sky" fill="none" stroke="currentColor"><circle cx="307.0" cy="82.8" r="4.2" stroke-width="1.8"/><circle cx="316" cy="134" r="3.4" stroke-width="1.4"/></g><path pathLength="100" d="M327.5 117.6A20 20 0 0 0 312.5 114.3" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="359" y="86" text-anchor="middle" font-size="15" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">q'</text><text x="291" y="79" text-anchor="middle" font-size="15" class="il-sub il-sky" font-weight="700" fill="currentColor" stroke="none">k'</text><text x="325" y="102" text-anchor="middle" font-size="15" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">φ'</text><text x="104" y="208" text-anchor="middle" font-size="15" class="il-sub" fill="currentColor" stroke="none">q 转 mθ，k 转 nθ</text><text x="316" y="208" text-anchor="middle" font-size="15" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">φ' = φ（夹角不变）</text><g class="il-bronze-2"><path d="M20 232H201M219 232H400" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M210 228.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><text x="210" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">两对坐标转速（偏移 Δ=10，base=10000）</text><g class="il-muted" fill="none" stroke="currentColor"><path d="M250 264V320" stroke-width="1.1" stroke-dasharray="3 3" opacity=".55"/></g><text x="20" y="282" text-anchor="start" font-size="15" class="il-sub il-cinnabar" fill="currentColor" stroke="none">i=0 高频（θ₀=1）</text><g class="il-cinnabar"><rect x="208" y="268" width="42" height="16" rx="3" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1"/></g><text x="314" y="282" text-anchor="start" font-size="15" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">cos = −0.839</text><text x="20" y="310" text-anchor="start" font-size="15" class="il-sub il-jade" fill="currentColor" stroke="none">i=1 低频（θ₁=0.01）</text><g class="il-jade"><rect x="250" y="296" width="50" height="16" rx="3" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1"/></g><text x="314" y="310" text-anchor="start" font-size="15" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">cos = +0.995</text><text x="210" y="342" text-anchor="middle" font-size="15" class="il-sub il-muted" fill="currentColor" stroke="none">实心 ● 为 q / q'，空心 ○ 为 k / k'；虚线为平移前</text></svg>
