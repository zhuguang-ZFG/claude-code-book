<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 242" role="img" aria-label="Pre-LN Transformer block 的两次残差分支与末尾 Norm" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>Pre-LN Transformer block 的两次残差分支与末尾 Norm</title><desc>残差主干 x 水平直通，先后分出两条先经 RMSNorm 再经 Attention 与 FFN 的支路，重复 L 层后通过 Final Norm 送入 lm_head；底部对比 Post-LN。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M438 8H448V18M8 224V234H18M438 234H448V224"/></g><text x="228" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">Pre-LN Block：两次先归一化再加回</text><text x="228" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">残差主干 x 水平直通，全层末尾再经 Final Norm</text><g class="il-bronze-2"><path d="M20 60H219M237 60H436" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M228 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="32" y="62" width="296" height="118" rx="8" class="il-bronze-2" fill="currentColor" fill-opacity=".03" stroke="none"/><rect x="32" y="62" width="296" height="118" rx="8" class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".55" stroke-dasharray="4 3"/><text x="16" y="85" text-anchor="middle" font-size="16" class="il-sky" font-weight="700" fill="currentColor" stroke="none">x</text><g class="il-sky"><path pathLength="100" d="M24 80H136M156 80H288M308 80H340" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M131 76l6 4-6 4M283 76l6 4-6 4M335 76l6 4-6 4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="84" cy="80" r="3.2" fill="currentColor" stroke="none"/><circle cx="224" cy="80" r="3.2" fill="currentColor" stroke="none"/></g><path pathLength="100" d="M84 83V96m-4.5 -5 4.5 5 4.5 -5" class="il-jade" fill="none" stroke="currentColor" stroke-widt