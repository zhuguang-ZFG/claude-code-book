224 119V127m-4.5 -5 4.5 5 4.5 -5" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="184" y="127" width="80" height="24" rx="5" class="il-bronze" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="184" y="127" width="80" height="24" rx="5" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".75"/><text x="224" y="144" text-anchor="middle" font-size="16" class="il-sub" font-weight="700" fill="currentColor" stroke="none">FFN</text><g class="il-cinnabar"><path pathLength="100" d="M264 139H298V92m-4 4 4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="298" cy="80" r="9.5" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="1.6"/><path d="M293.5 80h9m-4.5-4.5v9" fill="none" stroke="currentColor" stroke-width="1.5"/></g><text x="180" y="171" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">重复 × L 层（主干不重归一）</text><rect x="342" y="64" width="94" height="34" rx="6" class="il-jade" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="342" y="64" width="94" height="34" rx="6" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".75"/><text x="389" y="86" text-anchor="middle" font-size="16" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">Final Norm</text><path pathLength="100" d="M389 98V121m-4.5 -5 4.5 5 4.5 -5" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="342" y="121" width="94" height="34" rx="6" class="il-cinnabar" fill="currentColor" fill-opacity=".14" stroke="none"/><rect x="342" y="121" width="94" height="34" rx="6" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".8"/><text x="389" y="143" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">lm_head</text><g class="il-bronze-2"><path d="M20 190H219M237 190H436" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M228 186.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><text x="228" y="210" text-anchor="middle" font-size="16" class="il-sub il-sky" fill="currentColor" stroke="none">Pre-LN：x 经每层 ⊕ 累积，末尾须再过 Final Norm</text><text x="228" y="231" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">Post-LN：x' = Norm(x + 子层(x))（主干每步被重缩放）</text></svg>
