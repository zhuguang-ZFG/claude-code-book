<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 382" role="img" aria-label="六个候选在两种温度下的概率" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>六个候选在两种温度下的概率</title><desc>合成 logits 的温度对照。首都的概率由 T=1 时 0.371 增至 T=0.2 时 0.865；各候选排序不变。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 364V374H18M422 374H432V364"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">温度改变概率陡度，不改变排序</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">T=0.2 把概率压向峰顶；T=1.0 保留尾部候选</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="94" y="72" width="114" height="24" rx="12" class="il-cinnabar" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="94" y="72" width="114" height="24" rx="12" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="151" y="88.08" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" fill="currentColor" stroke="none">■ T = 0.2（尖锐）</text><rect x="232" y="72" width="114" height="24" rx="12" class="il-sky" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="232" y="72" width="114" height="24" rx="12" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="289" y="88.08" text-anchor="middle" font-size="16" class="il-sub il-sky" fill="currentColor" stroke="none">□ T = 1.0（平缓）</text><path d="M84 106V318" class="il-muted" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity=".35"/><text x="84" y="336" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="c