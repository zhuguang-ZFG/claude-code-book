<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-label="输入、预留与剩余容量的窗口预算" class="llm-explainer" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>输入、预留与剩余容量的窗口预算</title><desc>系统 900、工具 2400、历史 18000、检索 60000、输出预留 4096、安全余量 2048；窗口尚未分配 40556。</desc><text x="200" y="26" text-anchor="middle" font-size="22" fill="currentColor" stroke="none">128 000 token 的分配</text><text x="24" y="63" text-anchor="start" font-size="18" fill="currentColor" stroke="none">系统提示</text><text x="375" y="63" text-anchor="end" font-size="18" fill="currentColor" stroke="none">900</text><path d="M150 56h1.80" stroke-width="8" opacity=".35"/><text x="24" y="98" text-anchor="start" font-size="18" fill="currentColor" stroke="none">工具定义</text><text x="375" y="98" text-anchor="end" font-size="18" fill="currentColor" stroke="none">2,400</text><path d="M150 91h4.80" stroke-width="8" opacity=".35"/><text x="24" y="133" text-anchor="start" font-size="18" fill="currentColor" stroke="none">历史消息</text><text x="375" y="133" text-anchor="end" font-size="18" fill="currentColor" stroke="none">18,000</text><path d="M150 126h36.00" stroke-width="8" opacity=".35"/><text x="24" y="168" text-anchor="start" font-size="18" fill="currentColor" stroke="none">检索材料</text><text x="375" y="168" text-anchor="end" font-size="18" fill="currentColor" stroke="none">60,000</text><path d="M150 161h120.00" stroke-width="8" opacity=".35"/><text x="24" y="203" text-anchor="start" font-size="18" fill="currentColor" stroke="none">输出预留</text><text x="375" y="203" text-anchor="end" font-size="18" fill="currentColor" stroke="none">4,096</text><path d="M150 196h8.19" stroke-width="8" opacity=".35"/><text x="24" y="238" text-anchor="start" font-size="18" fill="currentColor" stroke="none">安全余量</text><text x="375" y="238" text-anchor="end" font-size="18" fill="currentColor" stroke="none">2,048</text><path d="M150 231h4.10" stroke-width="8" opacity=".35"/><text x="24" y="273" text-anchor="start" font-size="18" fill="currentColor" stroke="none">尚未分配</text><text x="375" y="273" text-anchor="end" font-size="18" fill="currentColor" stroke="none">40,556</text><path d="M150 266h81.11" stroke-width="8" opacity=".35"/><path d="M20 294H380"/><text x="200" y="323" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">实际输入 81 300；规划合计 87 444</text><text x="200" y="352" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">输出与安全余量尚未实际占用</text></svg>
