<svg viewBox="0 0 399.6 352.8" version="1.1" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="单条序列的 KV 数据量随长度线性增长" font-family="sans-serif" class="llm-explainer"><title>单条序列的 KV 数据量随长度线性增长</title><desc>每 token 128 KiB。4096 token 为 0.5 GiB，32768 为 4 GiB，131072 为 16 GiB。</desc><g><g><path d="M 0 352.8 L 399.6 352.8 L 399.6 0 L 0 0 L 0 352.8 z" fill="none" /></g><g><g><path d="M 75.924 254.016 L 351.648 254.016 L 351.648 63.504 L 75.924 63.504 L 75.924 254.016 z" fill="none" /></g><g /><g /><g><path d="M 75.924 254.016 L 351.648 74.710588" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" /></g><g><path d="M 75.924 254.016 L 351.648 254.016" fill="none" stroke="currentColor" stroke-linecap="square" /></g><g><path d="M 75.924 254.016 L 75.924 63.504" fill="none" stroke="currentColor" stroke-linecap="square" /></g><g><path d="M 84.540375 254.016 L 84.540375 248.412706" fill="none" stroke-dasharray="2.59,1.12" stroke-dashoffset="0" stroke="currentColor" stroke-width="0.7" /></g><g><path d="M 144.855 254.016 L 144.855 209.189647" fill="none" stroke-dasharray="2.59,1.12" stroke-dashoffset="0" stroke="currentColor" stroke-width="0.7" /></g><g><path d="M 351.648 254.016 L 351.648 74.710588" fill="none" stroke-dasharray="2.59,1.12" stroke-dashoffset="0" stroke="currentColor" stroke-width="0.7" /></g><g><text x="213.786" y="38.73744" transform="rotate(-0 213.786 38.73744)" font-size="17px" text-anchor="middle" fill="currentColor">KV cache 随序列线性增长</text></g><g><text x="213.786" y="57.78864" transform="rotate(-0 213.786 57.78864)" font-size="15px" text-anchor="middle" fill="currentColor">32 层 / 8 KV 头 / 128 维 / fp16</text></g><g><text x="84.540375" y="220.396235" transform="rotate(-0 84.540375 220.396235)" font-size="16px" text-anchor="start" fill="currentColor">0.5 GiB</text></g><g><text x="144.855" y="186.776471" transform="rotate(-0 144.855 186.776471)" font-size="16px" text-anchor="middle" fill="currentColor">4 GiB</text></g><g><text x="351.648" y="67.426306" transform="rotate(-0 351.648 67.426306)" font-size="16px" text-anchor="middle" fill="currentColor">16 GiB</text></g><g><text x="84.540375" y="280.911812" transform="rotate(-0 84.540375 280.911812)" font-size="15px" text-anchor="middle" fill="currentColor">4,096</text></g><g><text x="144.855" y="265.222588" transform="rotate(-0 144.855 265.222588)" font-size="15px" text-anchor="middle" fill="currentColor">32,768</text></g><g><text x="351.648" y="265.222588" transform="rotate(-0 351.648 265.222588)" font-size="15px" text-anchor="middle" fill="currentColor">131,072</text></g><g><text x="213.786" y="301.644" transform="rotate(-0 213.786 301.644)" font-size="16px" text-anchor="middle" fill="currentColor">序列长度 / token</text></g><g><text x="81.43848" y="82.5552" transform="rotate(-0 81.43848 82.5552)" font-size="16px" text-anchor="start" fill="currentColor">KV / GiB</text></g><g><text x="213.786" y="335.93616" transform="rotate(-0 213.786 335.93616)" font-size="15px" text-anchor="middle" fill="currentColor">单序列；未计分块和元数据</text></g></g></g></svg>
