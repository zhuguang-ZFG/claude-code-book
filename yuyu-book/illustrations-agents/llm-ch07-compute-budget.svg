<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 412" role="img" aria-label="7B 混合精度训练显存拆解与分布式并行策略" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>7B 训练状态账与并行切分</title><desc>拆解 7B 训练 16 字节每参数共 104.3 GiB 的权重、梯度、主权重与优化器状态，对比 DP、TP、PP 与 ZeRO/FSDP 切分方式。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 394V404H18M422 404H432V394"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">7B 训练状态账（104.3 GiB）与四卡切分</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">混合精度 16 B/参数拆解 · 并行策略 · 训推算力差</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><text x="20" y="84" text-anchor="start" font-size="16" class="il-sub" font-weight="700" fill="currentColor" stroke="none">训练状态最小账（16 B/参 = 104.3 GiB，未含激活）</text><rect x="20" y="94" width="50" height="28" rx="3" class="il-sky" fill="currentColor" fill-opacity=".24" stroke="currentColor" stroke-width="1.2"/><text x="45" y="113" text-anchor="middle" font-size="16" class="il-sub il-sky" font-weight="700" fill="currentColor" stroke="none">2B</text><text x="45" y="140" text-anchor="middle" font-size="16" class="il-sub" fill="currentColor" stroke="none">fp16 权</text><rect x="70" y="94" width="50" height="28" rx="3" class="il-jade" fill="currentColor" fill-opacity=".24" stroke="currentColor" stroke-width="1.2"/><text x="95" y="113" text-anchor="middle" font-size="16" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">2B</text><text x="95" y="140" text-anchor="middle" font-size="16" class="il-sub" fill="currentColor" stroke="none">梯度</text><rect x="120" y="94" wid