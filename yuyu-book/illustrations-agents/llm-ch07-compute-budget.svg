 font-weight="700" fill="currentColor" stroke="none">推 7B @1M tok ≈ 1.4×10¹⁶（理想 35s · 实受带宽）</text><text x="220" y="396" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">真正训模型还要额外加激活缓存、重计算与通信开销</text></svg>
