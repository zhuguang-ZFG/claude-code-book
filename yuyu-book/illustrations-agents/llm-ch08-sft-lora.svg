<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-label="LoRA 低秩适配器结构与不同秩的参数规模对比" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>LoRA 结构与参数规模</title><desc>冻结 W 并通过随机初始化 A 与零初始化 B 注入低秩更新；展示 r=1 到 4096 占 4096×4096 矩阵 0.049% 到 200% 的参数比例及合并前后示例向量。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 422V432H18M422 432H432V422"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">LoRA：冻结 W，只训低秩旁路 B·A</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">W' = W + (α/r)·B·A · A 随机 / B 初始化为 0</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="18" y="68" width="190" height="86" rx="8" class="il-bronze" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="18" y="68" width="190" height="86" rx="8" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="18" y="75" width="3.5" height="72" rx="1.7" class="il-bronze" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="113" y="93" text-anchor="middle" font-size="16" class="il-bronze-3" font-weight="700" fill="currentColor" stroke="none">主干 W（冻结）</text><text x="113" y="118" text-anchor="middle" font-size="16" class="il-sub" fill="currentColor" stroke="none">基座 [0.3,0.4,0.3,0.5]</text><text x="113" y="143" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">x=[1,1,1,1] 直通不改</text><rect x="218" y="68" width="204" height="86" rx="8" class="il-jade" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="218" y="68" width="204" height="86" rx="8" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="218" y="75" width="3.5" height="72" rx="1.7" class="il-jade" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="320" y="93" text-anchor="middle" font-size="16" class="il-jade" font-weight="700" fill="currentColor" stroke="none">旁路 (α/r)B·A · r=2,α=4</text><text x="320" y="118" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">合并=[0.3,0.5,0.3,0.54]</text><text x="320" y="143" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">起始 B=0 → 等价原模型</text><text x="20" y="178" text-anchor="start" font-size="16" font-weight="700" fill="currentColor" stroke="none">单个 4096×4096 矩阵对比（全量 = 16.78M 参数）：</text><text x="20" y="209" text-anchor="start" font-size="16" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">r = 1</text><rect x="92" y="197" width="118" height="12" rx="3" class="il-muted" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="92" y="197" width="7.08" height="12" rx="3" class="il-jade" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1" stroke-opacity=".85"/><text x="220" y="209" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">8,192 (0.049%) · 16 KiB</text><text x="20" y="241" text-anchor="start" font-size="16" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">r = 8</text><rect x="92" y="229" width="118" height="12" rx="3" class="il-muted" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="92" y="229" width="16.52" height="12" rx="3" class="il-jade" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1" stroke-opacity=".85"/><text x="220" y="241" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">65,536 (0.391%) · 128 KiB</text><text x="20" y="273" text-anchor="start" font-size="16" class="il-sub il-sky" font-weight="700" fill="currentColor" stroke="none">r = 16</text><rect x="92" y="261" width="118" height="12" rx="3" class="il-muted" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="92" y="261" width="25.96" height="12" rx="3" class="il-sky" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1" stroke-opacity=".85"/><text x="220" y="273" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">131,072 (0.781%) · 256 KiB</text><text x="20" y="305" text-anchor="start" font-size="16" class="il-sub il-bronze" font-weight="700" fill="currentColor" stroke="none">r = 64</text><rect x="92" y="293" width="118" height="12" rx="3" class="il-muted" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="92" y="293" width="44.84" height="12" rx="3" class="il-bronze" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1" stroke-opacity=".85"/><text x="220" y="305" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">524,288 (3.13%) · 1.0 MiB</text><text x="20" y="337" text-anchor="start" font-size="16" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">r = 4096</text><rect x="92" y="325" width="118" height="12" rx="3" class="il-muted" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="92" y="325" width="118" height="12" rx="3" class="il-cinnabar" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1" stroke-opacity=".85"/><text x="220" y="337" text-anchor="start" font-size="16" class="il-sub il-cinnabar" fill="currentColor" stroke="none">33.55M (200% · 反而翻倍!)</text><rect x="20" y="360" width="194" height="62" rx="8" class="il-sky" fill="currentColor" fill-opacity=".07" stroke="none"/><rect x="20" y="360" width="194" height="62" rx="8" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".6"/><text x="117" y="384" text-anchor="middle" font-size="16" class="il-sub il-sky" font-weight="700" fill="currentColor" stroke="none">旁路 (r=8·32层≈4 MiB)</text><text x="117" y="409" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">多租户热切，多两次小乘</text><rect x="226" y="360" width="194" height="62" rx="8" class="il-cinnabar" fill="currentColor" fill-opacity=".07" stroke="none"/><rect x="226" y="360" width="194" height="62" rx="8" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".6"/><text x="323" y="384" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">merge_and_unload()</text><text x="323" y="409" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">并回 W 省分支，需重测</text></svg>
