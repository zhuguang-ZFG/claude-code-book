<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 376" role="img" aria-label="Static Batching 与 Continuous Batching 槽位利用率时间线对比" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>Static vs Continuous Batching</title><desc>对长度 20、200、50、120 的四条请求，2 个并发槽位下 Static Batching 因等待最长请求产生大量空闲，利用率 60.9%；Continuous Batching 释放即补槽，利用率达 97.5%。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 358V368H18M422 368H432V358"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">Static vs Continuous Batching：消除气泡</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">请求长度 [20, 200, 50, 120]，2 个并发槽位调度对比</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="20" y="68" width="400" height="114" rx="8" class="il-cinnabar" fill="currentColor" fill-opacity=".04" stroke="none"/><rect x="20" y="68" width="400" height="114" rx="8" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".6"/><rect x="20" y="75" width="3.5" height="100" rx="1.7" class="il-cinnabar" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="34" y="90" text-anchor="start" font-size="16" class="il-cinnabar" font-weight="700" fill="currentColor" stroke="none">① Static Batching（利用率 60.9% · 320 步）</text><text x="34" y="122" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">槽1</text><rect x="72" y="106" width="21" height="22" rx="3" class="il-sky" fill="currentColor" fill-opacity=".35" stroke="currentColor"/><rect x="93" y="106" width="189" height="22" rx="3" class="il-cinnabar" fill="currentColor" fill-opacity=".10" stroke="currentColor" stroke-dasharray="3 2"/><text x="187.5" y="122" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" fill="currentColor" stroke="none">空闲气泡 (等200)</text><rect x="282" y="106" width="52.5" height="22" rx="3" class="il-jade" fill="currentColor" fill-opacity=".35" stroke="currentColor"/><rect x="334.5" y="106" width="73.5" height="22" rx="3" class="il-cinnabar" fill="currentColor" fill-opacity=".10" stroke="currentColor" stroke-dasharray="3 2"/><text x="371.25" y="122" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" fill="currentColor" stroke="none">等120</text><text x="34" y="158" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">槽2</text><rect x="72" y="142" width="210" height="22" rx="3" class="il-sky" fill="currentColor" fill-opacity=".28" stroke="currentColor"/><text x="177" y="158" text-anchor="middle" font-size="16" class="il-sub il-sky" font-weight="700" fill="currentColor" stroke="none">R2 (200 步)</text><rect x="282" y="142" width="126" height="22" rx="3" class="il-jade" fill="currentColor" fill-opacity=".28" stroke="currentColor"/><text x="345" y="158" text-anchor="middle" font-size="16" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">R4 (120 步)</text><rect x="20" y="194" width="400" height="114" rx="8" class="il-jade" fill="currentColor" fill-opacity=".06" stroke="none"/><rect x="20" y="194" width="400" height="114" rx="8" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="20" y="201" width="3.5" height="100" rx="1.7" class="il-jade" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="34" y="216" text-anchor="start" font-size="16" class="il-jade" font-weight="700" fill="currentColor" stroke="none">② Continuous Batching（97.5% · 200 步）</text><text x="34" y="248" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">槽1</text><rect x="72" y="232" width="21" height="22" rx="3" class="il-sky" fill="currentColor" fill-opacity=".35" stroke="currentColor"/><rect x="93" y="232" width="52.5" height="22" rx="3" class="il-jade" fill="currentColor" fill-opacity=".35" stroke="currentColor"/><text x="119.25" y="248" text-anchor="middle" font-size="16" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">50</text><rect x="145.5" y="232" width="126" height="22" rx="3" class="il-bronze" fill="currentColor" fill-opacity=".30" stroke="currentColor"/><text x="208.5" y="248" text-anchor="middle" font-size="16" class="il-sub il-bronze-3" font-weight="700" fill="currentColor" stroke="none">R4 (120) 补槽</text><rect x="271.5" y="232" width="10.5" height="22" rx="2" class="il-muted" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-dasharray="2 2"/><text x="34" y="284" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">槽2</text><rect x="72" y="268" width="210" height="22" rx="3" class="il-sky" fill="currentColor" fill-opacity=".28" stroke="currentColor"/><text x="177" y="284" text-anchor="middle" font-size="16" class="il-sub il-sky" font-weight="700" fill="currentColor" stroke="none">R2 (200 步不间断执行)</text><rect x="20" y="324" width="194" height="28" rx="14" class="il-sky" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="20" y="324" width="194" height="28" rx="14" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="117" y="342.76" text-anchor="middle" font-size="16" class="il-sub il-sky" fill="currentColor" stroke="none">PagedAttention：按页分配</text><rect x="226" y="324" width="194" height="28" rx="14" class="il-bronze" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="226" y="324" width="194" height="28" rx="14" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="323" y="342.76" text-anchor="middle" font-size="16" class="il-sub il-bronze" fill="currentColor" stroke="none">APC 缓存：复用系统前缀</text></svg>
