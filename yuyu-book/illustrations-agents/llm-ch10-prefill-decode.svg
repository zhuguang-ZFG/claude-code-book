<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 428" role="img" aria-label="Prefill 与 Decode 性能瓶颈及 7B 显卡显存容量边界" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>Prefill 与 Decode 瓶颈拆解</title><desc>对比 Prefill 算力受限(TTFT)与 Decode 带宽受限(TPOT)，并给出 80 GiB 卡上 8K/32K 上下文不同 batch 的 KV 大小、吞吐及 OOM 阈值。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 410V420H18M422 420H432V410"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">Prefill 算力受限 vs Decode 带宽受限</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">7B @ 80 GiB 卡（fp16 13.0G · KV 128KiB/tok）</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="20" y="68" width="194" height="80" rx="8" class="il-cinnabar" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="20" y="68" width="194" height="80" rx="8" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="20" y="75" width="3.5" height="66" rx="1.7" class="il-cinnabar" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="34" y="92" text-anchor="start" font-size="16" class="il-cinnabar" font-weight="700" fill="currentColor" stroke="none">Prefill 并行吃提示</text><text x="34" y="116" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">决定 TTFT (8K 估 0.29s)</text><text x="34" y="140" text-anchor="start" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">典型算力 / FLOPs 受限</text><rect x="226" y="68" width="194" height="80" rx="8" class="il-sky" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="226" y="68" width="194" height="80" rx="8" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="226" y="75" width="3.5" height="66" rx="1.7" class="il-sky" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="240" y="92" text-anchor="start" font-size="16" class="il-sky" font-weight="700" fill="currentColor" stroke="none">Decode 逐个吐 token</text><text x="240" y="116" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">决定 TPOT (5–50 ms)</text><text x="240" y="140" text-anchor="start" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">每步搬权重+全部 KV</text><text x="20" y="174" text-anchor="start" font-size="16" font-weight="700" fill="currentColor" stroke="none">80 GiB 卡带宽估算：batch 增大最终遇 OOM：</text><path d="M20 215H420" class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1" opacity=".20"/><text x="20" y="207" text-anchor="start" font-size="16" class="il-sub" font-weight="700" fill="currentColor" stroke="none">8K · b=1</text><rect x="114" y="195" width="68" height="11" rx="3" class="il-muted" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="114" y="195" width="17" height="11" rx="3" class="il-jade" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1" stroke-opacity=".85"/><text x="190" y="207" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">1G KV · 199 t/s</text><rect x="358" y="191" width="62" height="22" rx="11" class="il-jade" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="358" y="191" width="62" height="22" rx="11" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="389" y="205.74" text-anchor="middle" font-size="16" class="il-sub il-jade" fill="currentColor" stroke="none">✓ 装下</text><path d="M20 246H420" class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1" opacity=".20"/><text x="20" y="238" text-anchor="start" font-size="16" class="il-sub" font-weight="700" fill="currentColor" stroke="none">8K · b=8</text><rect x="114" y="226" width="68" height="11" rx="3" class="il-muted" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="114" y="226" width="37.4" height="11" rx="3" class="il-jade" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1" stroke-opacity=".85"/><text x="190" y="238" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">8G KV · 1062 t/s</text><rect x="358" y="222" width="62" height="22" rx="11" class="il-jade" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="358" y="222" width="62" height="22" rx="11" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="389" y="236.74" text-anchor="middle" font-size="16" class="il-sub il-jade" fill="currentColor" stroke="none">✓ 装下</text><path d="M20 277H420" class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1" opacity=".20"/><text x="20" y="269" text-anchor="start" font-size="16" class="il-sub" font-weight="700" fill="currentColor" stroke="none">8K · b=32</text><rect x="114" y="257" width="68" height="11" rx="3" class="il-muted" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="114" y="257" width="68" height="11" rx="3" class="il-sky" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1" stroke-opacity=".85"/><text x="190" y="269" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">32G KV · 1985 t/s</text><rect x="358" y="253" width="62" height="22" rx="11" class="il-sky" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="358" y="253" width="62" height="22" rx="11" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="389" y="267.74" text-anchor="middle" font-size="16" class="il-sub il-sky" fill="currentColor" stroke="none">✓ 装下</text><path d="M20 308H420" class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1" opacity=".20"/><text x="20" y="300" text-anchor="start" font-size="16" class="il-sub" font-weight="700" fill="currentColor" stroke="none">32K · b=8</text><rect x="114" y="288" width="68" height="11" rx="3" class="il-muted" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="114" y="288" width="20.4" height="11" rx="3" class="il-jade" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1" stroke-opacity=".85"/><text x="190" y="300" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">32G KV · 496 t/s</text><rect x="358" y="284" width="62" height="22" rx="11" class="il-jade" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="358" y="284" width="62" height="22" rx="11" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="389" y="298.74" text-anchor="middle" font-size="16" class="il-sub il-jade" fill="currentColor" stroke="none">✓ 装下</text><path d="M20 339H420" class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1" opacity=".20"/><text x="20" y="331" text-anchor="start" font-size="16" class="il-sub" font-weight="700" fill="currentColor" stroke="none">32K · b=32</text><rect x="114" y="319" width="68" height="11" rx="3" class="il-muted" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="114" y="319" width="68" height="11" rx="3" class="il-cinnabar" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1" stroke-opacity=".85"/><text x="190" y="331" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">128G KV · &gt;80G</text><rect x="358" y="315" width="62" height="22" rx="11" class="il-cinnabar" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="358" y="315" width="62" height="22" rx="11" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="389" y="329.74" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" fill="currentColor" stroke="none">✗ OOM</text><rect x="20" y="354" width="400" height="58" rx="8" class="il-bronze" fill="currentColor" fill-opacity=".07" stroke="none"/><rect x="20" y="354" width="400" height="58" rx="8" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><text x="220" y="377" text-anchor="middle" font-size="16" class="il-sub" fill="currentColor" stroke="none">权重量化省主权重：fp16 13G → int8 6.5G → int4 3.3G</text><text x="220" y="402" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">边界：量化权重不会自动量化并压缩 KV cache</text></svg>
