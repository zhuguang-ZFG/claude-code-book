<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 356" role="img" aria-label="RAG 文档切块尺寸截断对比与元数据字段" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>切块边界与元数据四件套</title><desc>对比 10 字切块切断“原路退|回”(intact=False) 与 20 字带标题完整切块(intact=True)，并列出版本、更新时间、ACL 权限和邻块索引元数据。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 338V348H18M422 348H432V338"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">切块边界与元数据四件套</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">过短机械切块会切断答案；合理粒度配标题与权限元数据</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="20" y="68" width="400" height="78" rx="8" class="il-cinnabar" fill="currentColor" fill-opacity=".06" stroke="none"/><rect x="20" y="68" width="400" height="78" rx="8" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="20" y="75" width="3.5" height="64" rx="1.7" class="il-cinnabar" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="34" y="92" text-anchor="start" font-size="16" class="il-cinnabar" font-weight="700" fill="currentColor" stroke="none">切块 length=10：把答案“原路退回”拦腰切断 ✗</text><rect x="34" y="104" width="184" height="30" rx="4" class="il-cinnabar" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="34" y="104" width="184" height="30" rx="4" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><text x="126" y="125" text-anchor="middle" font-size="16" class="il-sub" fill="currentColor" stroke="none">退款审核通过后原路退</text><text x="234" y="125" text-anchor="middle" fo