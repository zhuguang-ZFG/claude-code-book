<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 408" role="img" aria-label="混合检索流水线与关键词、向量指标对比" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>RAG 混合流水线与指标</title><desc>展示版本过滤与去重、BM25 与向量双路召回、RRF 融合及重排把正确文档排至第 1 名，并汇总五条查询关键词(NDCG 0.77)与向量(NDCG 0.97)均值。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 390V400H18M422 400H432V390"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">混合 RAG 流水线与五问平均表现</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">版本过滤 → BM25+向量双路 → RRF 融合 → 重排</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="20" y="68" width="400" height="44" rx="8" class="il-bronze" fill="currentColor" fill-opacity=".07" stroke="none"/><rect x="20" y="68" width="400" height="44" rx="8" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".6"/><text x="220" y="95" text-anchor="middle" font-size="16" class="il-sub" font-weight="700" fill="currentColor" stroke="none">6 文档 / 13 切块 → 滤除旧版 v1 并去重 → 12 块入库</text><path pathLength="100" d="M220 112V128m-4.5 -5 4.5 5 4.5 -5" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="18" y="128" width="198" height="62" rx="8" class="il-sky" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="18" y="128" width="198" height="62" rx="8" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="30" y="128" width="174" height="3" rx="1.5" class="il-sky" fill="currentColor" fill-opacity=".85" stroke="none"