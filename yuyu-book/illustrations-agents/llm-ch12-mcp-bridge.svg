<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 432" role="img" aria-label="MCP 请求与响应：发现、列工具、调用工具" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>MCP 请求与响应：发现、列工具、调用工具</title><desc>2026-07-28 的发现请求是可选的；每次请求携带版本和客户端能力。客户端发请求，服务器返回结果或协议错误，完成结果包含 resultType。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 414V424H18M422 424H432V414"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">MCP 2026-07-28 请求与响应</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">JSON-RPC 交互：每次携带协议版本与客户端能力</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="36" y="70" width="92" height="28" rx="14" class="il-sky" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="36" y="70" width="92" height="28" rx="14" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="82" y="88.76" text-anchor="middle" font-size="16" class="il-sub il-sky" font-weight="700" fill="currentColor" stroke="none">客户端</text><rect x="312" y="70" width="92" height="28" rx="14" class="il-jade" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="312" y="70" width="92" height="28" rx="14" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="358" y="88.76" text-anchor="middle" font-size="16" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">服务器</text><path d="M82 98V358M358 98V358" class="il-muted" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 4" opacity=".5"/><text x="220" y="117" text-anchor="middle" font-size="16" class="il-sub" font-weight="700" fill="currentColor" stroke="none">server/discover（可选）</text><path pathLength="100" d="M84 128H354m-5 -4 5 4 -5 4" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="159" text-anchor="middle" font-size="16" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">supportedVersions + capabilities</text><path pathLength="100" d="M354 170H84m5 -4 -5 4 5 4" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="203" text-anchor="middle" font-size="16" class="il-sub il-sky" font-weight="700" fill="currentColor" stroke="none">tools/list</text><path pathLength="100" d="M84 214H354m-5 -4 5 4 -5 4" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="245" text-anchor="middle" font-size="16" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">工具清单 + inputSchema</text><path pathLength="100" d="M354 256H84m5 -4 -5 4 5 4" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="289" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">tools/call (arguments)</text><path pathLength="100" d="M84 300H354m-5 -4 5 4 -5 4" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="331" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">result (resultType) / error</text><path pathLength="100" d="M354 342H84m5 -4 -5 4 5 4" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><g class="il-bronze-2"><path d="M20 370H211M229 370H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 366.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><text x="220" y="391" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" fill="currentColor" stroke="none">协议错 (-32602 未知工具) vs 执行错 (isError: true)</text><text x="220" y="416" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">发现阶段可选；完成结果均须携带 resultType 标识</text></svg>
