<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-label="MCP 请求与响应：发现、列工具、调用工具" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif" class="llm-explainer"><title>MCP 请求与响应：发现、列工具、调用工具</title><desc>2026-07-28 的发现请求是可选的；每次请求携带版本和客户端能力。客户端发请求，服务器返回结果或协议错误，完成结果包含 resultType。</desc><text x="200" y="25" text-anchor="middle" font-size="22" fill="currentColor" stroke="none">MCP 2026-07-28</text><text x="70" y="62" text-anchor="middle" font-size="20" fill="currentColor" stroke="none">客户端</text><text x="330" y="62" text-anchor="middle" font-size="20" fill="currentColor" stroke="none">服务器</text><path d="M70 77V354M330 77V354" opacity=".4" /><text x="200" y="95" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">server/discover</text><path d="M70 105H330m-6 -5 6 5 -6 5" /><text x="200" y="139" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">版本与能力</text><path d="M330 149H70m6 -5 -6 5 6 5" /><text x="200" y="185" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">tools/list</text><path d="M70 195H330m-6 -5 6 5 -6 5" /><text x="200" y="229" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">工具定义</text><path d="M330 239H70m6 -5 -6 5 6 5" /><text x="200" y="275" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">tools/call</text><path d="M70 285H330m-6 -5 6 5 -6 5" /><text x="200" y="319" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">结果或协议错误</text><path d="M330 329H70m6 -5 -6 5 6 5" /><text x="200" y="383" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">每次请求携带版本与客户端能力</text><text x="200" y="410" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">发现可选；完成结果带 resultType</text></svg>
