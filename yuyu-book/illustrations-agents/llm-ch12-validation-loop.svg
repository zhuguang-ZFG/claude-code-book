<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" role="img" aria-label="工具调用：提议、校验、执行、回传" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif" class="llm-explainer"><title>工具调用：提议、校验、执行、回传</title><desc>模型提出调用；运行时校验参数和权限，执行后记录结果。可修正的参数错误反馈给模型，重试次数有上限。</desc><text x="200" y="27" text-anchor="middle" font-size="22" fill="currentColor" stroke="none">调用结果要能检查</text><rect x="40" y="48" width="320" height="48" rx="8" /><text x="200" y="78" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">模型提出：工具名 + 参数</text><path d="M200 96V118m-5 -6 5 6 5 -6" /><rect x="40" y="124" width="320" height="48" rx="8" /><text x="200" y="154" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">校验参数、核对权限</text><path d="M200 172V194m-5 -6 5 6 5 -6" /><rect x="40" y="200" width="320" height="48" rx="8" /><text x="200" y="230" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">执行并记录业务结果</text><path d="M200 248V270m-5 -6 5 6 5 -6" /><rect x="40" y="276" width="320" height="48" rx="8" /><text x="200" y="306" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">回传结果，继续或结束</text><text x="200" y="353" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">参数可修正 → 有上限地重试</text></svg>
