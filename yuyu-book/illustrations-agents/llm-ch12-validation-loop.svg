<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 396" role="img" aria-label="工具调用：提议、校验、执行、回传" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>工具调用：提议、校验、执行、回传</title><desc>模型提出调用；运行时校验参数和权限，执行后记录结果。可修正的参数错误反馈给模型，重试次数有上限。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 378V388H18M422 388H432V378"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">工具调用闭环：提议 → 校验 → 执行 → 回传</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">运行时把关参数 Schema 与权限，可修正错误限次重试</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="22" y="70" width="294" height="50" rx="8" class="il-sky" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="22" y="70" width="294" height="50" rx="8" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><rect x="22" y="77" width="3.5" height="36" rx="1.7" class="il-sky" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="36" y="91" text-anchor="start" font-size="16" class="il-sky" font-weight="700" fill="currentColor" stroke="none">① 模型提议调用</text><text x="36" y="112" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">tool_name + JSON (如 1001)</text><path pathLength="100" d="M169 120V140m-4.5 -5 4.5 5 4.5 -5" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="140" width="294" height="50" rx="8" class="il-cinnabar" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="22" y="140" width="294" height="50" rx="8" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><rect x="22" y="147" width="3.5" height="36" rx="1.7" class="il-cinnabar" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="36" y="161" text-anchor="start" font-size="16" class="il-cinnabar" font-weight="700" fill="currentColor" stroke="none">② 校验 Schema 与权限</text><text x="36" y="182" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">类型、正则 ^ORD-[0-9]{4}$ 与越权拦截</text><path pathLength="100" d="M169 190V210m-4.5 -5 4.5 5 4.5 -5" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="210" width="294" height="50" rx="8" class="il-jade" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="22" y="210" width="294" height="50" rx="8" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><rect x="22" y="217" width="3.5" height="36" rx="1.7" class="il-jade" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="36" y="231" text-anchor="start" font-size="16" class="il-jade" font-weight="700" fill="currentColor" stroke="none">③ 执行并记录业务结果</text><text x="36" y="252" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">外部 API / 审计账本（超时+幂等）</text><path pathLength="100" d="M169 260V280m-4.5 -5 4.5 5 4.5 -5" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="280" width="294" height="50" rx="8" class="il-bronze" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="22" y="280" width="294" height="50" rx="8" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><rect x="22" y="287" width="3.5" height="36" rx="1.7" class="il-bronze" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="36" y="301" text-anchor="start" font-size="16" class="il-bronze" font-weight="700" fill="currentColor" stroke="none">④ 回传结构化回执</text><text x="36" y="322" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">isError=false → 继续推理或回复</text><path pathLength="100" d="M316 165H375V158M375 104V95H322m5-4-5 4 5 4" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="328" y="104" width="94" height="54" rx="6" class="il-cinnabar" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="328" y="104" width="94" height="54" rx="6" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="375" y="126" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">可修正报错</text><text x="375" y="150" text-anchor="middle" font-size="16" class="il-sub" fill="currentColor" stroke="none">限次重试</text><rect x="22" y="348" width="396" height="28" rx="14" class="il-jade" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="22" y="348" width="396" height="28" rx="14" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="220" y="366.76" text-anchor="middle" font-size="16" class="il-sub il-jade" fill="currentColor" stroke="none">例：1001 校验报错 → 重试 "ORD-1001" → 返回结果</text></svg>
