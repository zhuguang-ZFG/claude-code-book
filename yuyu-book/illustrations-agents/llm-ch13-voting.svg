<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 398" role="img" aria-label="答案票选示意：四票胜过两组各三票" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>答案票选示意：四票胜过两组各三票</title><desc>十条解答归一化后，A 得四票，B 和 C 各得三票，按最高票选择 A，无须超过半数；票数不能证明正确。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 380V390H18M422 390H432V380"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">自洽投票：按最终答案归票</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">同题采样 10 条 → 归一化提取答案 → 取最高票（相对多数）</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="48" y="70" width="344" height="42" rx="8" class="il-sky" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="48" y="70" width="344" height="42" rx="8" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><text x="220" y="97" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">① 同一道题独立采样 10 条 CoT 轨迹</text><path pathLength="100" d="M220 112V130m-4.5 -5 4.5 5 4.5 -5" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="130" width="344" height="42" rx="8" class="il-bronze" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="48" y="130" width="344" height="42" rx="8" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><text x="220" y="157" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">② 抽取末尾结论并归一化（去单位/格式噪点）</text><path pathLength="100" d="M220 172L84 194M220 172V194M220 172L356 194" class="il-bronze" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="20" y="196" width="128" height="104" rx="8" class="il-jade" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="20" y="196" width="128" height="104" rx="8" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".75"/><rect x="20" y="203" width="3.5" height="90" rx="1.7" class="il-jade" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="84" y="218" text-anchor="middle" font-size="16" class="il-jade" font-weight="700" fill="currentColor" stroke="none">答案 A</text><text x="84" y="253" text-anchor="middle" font-size="22" class="il-big il-jade" font-weight="700" fill="currentColor" stroke="none">4 票 ✓</text><rect x="36" y="264" width="96" height="8" rx="3" class="il-muted" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="36" y="264" width="76.8" height="8" rx="3" class="il-jade" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1" stroke-opacity=".85"/><text x="84" y="292" text-anchor="middle" font-size="16" class="il-sub il-jade" fill="currentColor" stroke="none">最高票胜出</text><rect x="156" y="196" width="128" height="104" rx="8" class="il-sky" fill="currentColor" fill-opacity=".05" stroke="none"/><rect x="156" y="196" width="128" height="104" rx="8" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".75"/><rect x="156" y="203" width="3.5" height="90" rx="1.7" class="il-sky" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="220" y="218" text-anchor="middle" font-size="16" class="il-sky" font-weight="700" fill="currentColor" stroke="none">答案 B</text><text x="220" y="253" text-anchor="middle" font-size="22" class="il-big il-sky" font-weight="700" fill="currentColor" stroke="none">3 票</text><rect x="172" y="264" width="96" height="8" rx="3" class="il-muted" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="172" y="264" width="57.6" height="8" rx="3" class="il-sky" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1" stroke-opacity=".85"/><text x="220" y="292" text-anchor="middle" font-size="16" class="il-sub il-sky" fill="currentColor" stroke="none">未过半</text><rect x="292" y="196" width="128" height="104" rx="8" class="il-muted" fill="currentColor" fill-opacity=".05" stroke="none"/><rect x="292" y="196" width="128" height="104" rx="8" class="il-muted" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".75"/><rect x="292" y="203" width="3.5" height="90" rx="1.7" class="il-muted" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="356" y="218" text-anchor="middle" font-size="16" class="il-muted" font-weight="700" fill="currentColor" stroke="none">答案 C</text><text x="356" y="253" text-anchor="middle" font-size="22" class="il-big il-muted" font-weight="700" fill="currentColor" stroke="none">3 票</text><rect x="308" y="264" width="96" height="8" rx="3" class="il-muted" fill="currentColor" fill-opacity=".10" stroke="none"/><rect x="308" y="264" width="57.6" height="8" rx="3" class="il-muted" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="1.1" stroke-opacity=".85"/><text x="356" y="292" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">未过半</text><rect x="20" y="314" width="400" height="68" rx="8" class="il-cinnabar" fill="currentColor" fill-opacity=".06" stroke="none"/><rect x="20" y="314" width="400" height="68" rx="8" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".6"/><text x="220" y="340" text-anchor="middle" font-size="16" class="il-cinnabar" font-weight="700" fill="currentColor" stroke="none">选 A：4 票为最高票（虽未超过半数），仍只看相对多数</text><text x="220" y="366" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">重要边界：高得票率只代表稳定输出，不代表答案正确</text></svg>
