<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 394" role="img" aria-label="答案票选示意：四票胜过两组各三票" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif" class="llm-explainer"><title>答案票选示意：四票胜过两组各三票</title><desc>十条解答归一化后，A 得四票，B 和 C 各得三票，按最高票选择 A，无须超过半数；票数不能证明正确。正文二元模拟要求正确次数超过半数。</desc><text x="200" y="28" text-anchor="middle" font-size="22" fill="currentColor" stroke="none">按最终答案计票</text><rect x="50" y="48" width="300" height="44" rx="8" /><text x="200" y="77" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">同题采样 10 条解答</text><path d="M200 92V115m-5 -6 5 6 5 -6" /><rect x="50" y="120" width="300" height="44" rx="8" /><text x="200" y="149" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">提取答案，归一化格式</text><path d="M200 164V187m-5 -6 5 6 5 -6" /><rect x="20" y="195" width="100" height="78" rx="8" /><text x="70" y="224" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">答案 A</text><text x="70" y="253" text-anchor="middle" font-size="20" fill="currentColor" stroke="none">4 票</text><rect x="150" y="195" width="100" height="78" rx="8" /><text x="200" y="224" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">答案 B</text><text x="200" y="253" text-anchor="middle" font-size="20" fill="currentColor" stroke="none">3 票</text><rect x="280" y="195" width="100" height="78" rx="8" /><text x="330" y="224" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">答案 C</text><text x="330" y="253" text-anchor="middle" font-size="20" fill="currentColor" stroke="none">3 票</text><text x="200" y="308" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">选 A：票数最多，未超过半数</text><text x="200" y="338" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">票数不能证明 A 正确</text><text x="200" y="376" text-anchor="middle" font-size="16" fill="currentColor" stroke="none">二元示例另问：正确次数是否过半</text></svg>
