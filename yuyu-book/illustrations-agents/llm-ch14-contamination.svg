<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 392" role="img" aria-label="数据污染造成的准确率虚高与配对 McNemar 检验差异" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>污染膨胀与 McNemar 配对检验</title><desc>展示 20/200 题污染将干净准确率 80.0% 拉高至 82.0%，以及总分同样是 164 vs 172 时，(0 vs 8) 的 McNemar p=0.0078 而 (20 vs 28) 为 0.3123。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 374V384H18M422 384H432V374"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">数据污染虚高与配对 McNemar 检验</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">200 题测试集：单看总体区间重叠易误判</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="20" y="68" width="400" height="92" rx="8" class="il-bronze-2" fill="currentColor" fill-opacity=".05" stroke="none"/><rect x="20" y="68" width="400" height="92" rx="8" class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".6"/><rect x="20" y="75" width="3.5" height="78" rx="1.7" class="il-cinnabar" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="34" y="90" text-anchor="start" font-size="16" class="il-cinnabar" font-weight="700" fill="currentColor" stroke="none">① 样本泄漏 10% (20/200) → 汇报率虚高 +2.0pp</text><rect x="34" y="102" width="334" height="22" rx="4" class="il-jade" fill="currentColor" fill-opacity=".22" stroke="currentColor"/><rect x="368" y="102" width="38" height="22" rx="4" class="il-cinnabar" fill="currentColor" fill-opacity=".30" stroke="currentColor"/><text x="201" y="118" text-anchor="middle" font-size="16" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">未见过 180 题：144/180 = 80.0%</text><text x="387" y="118" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">全对</text><text x="220" y="148" text-anchor="middle" font-size="16" class="il-sub" fill="currentColor" stroke="none">泄漏 20 题 100% → 账面 164/200 = 82.0%</text><text x="220" y="186" text-anchor="middle" font-size="16" class="il-sub" font-weight="700" fill="currentColor" stroke="none">② 总分 95%CI：A [76.1,86.7] vs B [80.5,90.1] 重叠</text><rect x="20" y="200" width="194" height="134" rx="8" class="il-jade" fill="currentColor" fill-opacity=".07" stroke="none"/><rect x="20" y="200" width="194" height="134" rx="8" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="20" y="207" width="3.5" height="120" rx="1.7" class="il-jade" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="117" y="224" text-anchor="middle" font-size="16" class="il-jade" font-weight="700" fill="currentColor" stroke="none">同题配对分歧小 (0 vs 8)</text><text x="117" y="250" text-anchor="middle" font-size="16" class="il-sub" fill="currentColor" stroke="none">同对164 · 同错28</text><text x="117" y="272" text-anchor="middle" font-size="16" class="il-sub il-jade" fill="currentColor" stroke="none">只A对=0 · 只B对=8</text><rect x="36" y="290" width="162" height="28" rx="14" class="il-jade" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="36" y="290" width="162" height="28" rx="14" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="117" y="308.76" text-anchor="middle" font-size="16" class="il-sub il-jade" font-weight="700" fill="currentColor" stroke="none">p = 0.0078 显著胜 ✓</text><rect x="226" y="200" width="194" height="134" rx="8" class="il-cinnabar" fill="currentColor" fill-opacity=".07" stroke="none"/><rect x="226" y="200" width="194" height="134" rx="8" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="226" y="207" width="3.5" height="120" rx="1.7" class="il-cinnabar" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="323" y="224" text-anchor="middle" font-size="16" class="il-cinnabar" font-weight="700" fill="currentColor" stroke="none">同题分歧大 (20 vs 28)</text><text x="323" y="250" text-anchor="middle" font-size="16" class="il-sub" fill="currentColor" stroke="none">同对144 · 同错8</text><text x="323" y="272" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" fill="currentColor" stroke="none">只A对=20 · 只B对=28</text><rect x="242" y="290" width="162" height="28" rx="14" class="il-cinnabar" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="242" y="290" width="162" height="28" rx="14" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="323" y="308.76" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">p = 0.3123 不显著 ✗</text><text x="220" y="366" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">总分均是 164 vs 172；须留逐题记录方可配对检验</text></svg>
