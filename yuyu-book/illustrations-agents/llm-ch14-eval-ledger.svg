<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 404" role="img" aria-label="大模型评测三象限、拒答指标拆分与蒸馏性价比账" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>三类评测、拒答账本与蒸馏</title><desc>展示知识、伦理安全、垂直领域三类评测，拆解 100 题中 80 回答 72 正确的覆盖率 80% 与回答内准确率 90%，并对比教师与蒸馏学生每道正确题成本。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 386V396H18M422 396H432V386"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">三类评测、拒答账本与蒸馏权衡</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">100 题只答 80 题：分开看覆盖率、回答内与整体</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="20" y="68" width="128" height="60" rx="8" class="il-sky" fill="currentColor" fill-opacity=".07" stroke="none"/><rect x="20" y="68" width="128" height="60" rx="8" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="20" y="75" width="3.5" height="46" rx="1.7" class="il-sky" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="84" y="93" text-anchor="middle" font-size="16" class="il-sky" font-weight="700" fill="currentColor" stroke="none">知识能力</text><text x="84" y="115" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">HELM / AGIEval</text><rect x="156" y="68" width="128" height="60" rx="8" class="il-cinnabar" fill="currentColor" fill-opacity=".07" stroke="none"/><rect x="156" y="68" width="128" height="60" rx="8" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".65"/><rect x="156" y="75" width="3.5" height="46" rx="1.7" class="il-cinnabar" fi