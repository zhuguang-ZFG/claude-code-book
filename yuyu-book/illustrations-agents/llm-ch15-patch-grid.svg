<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 418" role="img" aria-label="切块与投影：六乘四数值图生成六个三维向量" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif" class="llm-explainer"><title>切块与投影：六乘四数值图生成六个三维向量</title><desc>图像按二乘二切成六块；首块十、十二、十一、十三经手设四乘三矩阵投影，得到六点三、五点二、八点七。脚本没有位置嵌入或视觉 Transformer。</desc><text x="200" y="27" text-anchor="middle" font-size="22" fill="currentColor" stroke="none">数值图 → patch → 向量</text><rect x="80" y="48" width="80" height="40" rx="8" /><rect x="160" y="48" width="80" height="40" rx="8" /><rect x="240" y="48" width="80" height="40" rx="8" /><rect x="80" y="88" width="80" height="40" rx="8" /><rect x="160" y="88" width="80" height="40" rx="8" /><rect x="240" y="88" width="80" height="40" rx="8" /><text x="200" y="151" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">6×4 数值图，切成 6 个 2×2 块</text><path d="M200 162V192m-5 -6 5 6 5 -6" /><rect x="28" y="203" width="344" height="56" rx="8" /><text x="200" y="227" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">首块 [10, 12, 11, 13]</text><text x="200" y="249" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">4 个像素值 × 4×3 投影矩阵</text><path d="M200 259V286m-5 -6 5 6 5 -6" /><rect x="28" y="295" width="344" height="44" rx="8" /><text x="200" y="323" text-anchor="middle" font-size="20" fill="currentColor" stroke="none">[6.30, 5.20, 8.70]</text><text x="200" y="369" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">共 6 个三维向量；位置只打印编号</text><text x="200" y="398" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">本例没有位置嵌入和 Transformer</text></svg>
