<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-label="图像预算的三层：patch、视觉表示与 API 用量" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif" class="llm-explainer"><title>图像预算的三层：patch、视觉表示与 API 用量</title><desc>编码器 patch 数受预处理和块大小影响；连接器可能压缩为固定数量的表示，如 BLIP-2 的三十二个查询；API 计量需要另外核对模型规则。</desc><text x="200" y="27" text-anchor="middle" font-size="22" fill="currentColor" stroke="none">三种数量，分别核算</text><rect x="24" y="50" width="352" height="72" rx="8" /><text x="200" y="78" text-anchor="middle" font-size="20" fill="currentColor" stroke="none">视觉编码器</text><text x="200" y="106" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">patch 网格：分辨率与块大小</text><path d="M200 122V152m-5 -6 5 6 5 -6" /><rect x="24" y="160" width="352" height="72" rx="8" /><text x="200" y="188" text-anchor="middle" font-size="20" fill="currentColor" stroke="none">连接器</text><text x="200" y="216" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">送给语言模型的视觉表示</text><path d="M200 232V262m-5 -6 5 6 5 -6" /><rect x="24" y="270" width="352" height="72" rx="8" /><text x="200" y="298" text-anchor="middle" font-size="20" fill="currentColor" stroke="none">API 用量</text><text x="200" y="326" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">按具体模型与预处理规则核对</text><text x="200" y="382" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">例：BLIP-2 使用固定 32 个查询</text><text x="200" y="409" text-anchor="middle" font-size="17" fill="currentColor" stroke="none">patch 数不能直接替代账单 token</text></svg>
