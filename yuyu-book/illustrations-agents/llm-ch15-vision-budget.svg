<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 424" role="img" aria-label="图像预算的三层：patch、视觉表示与 API 用量" class="llm-explainer" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><title>图像预算的三层：patch、视觉表示与 API 用量</title><desc>编码器 patch 数受缩放和块大小影响；连接器可压缩成如 BLIP-2 的 32 查询；API 计费须另核对厂商瓦片规则。</desc><g class="il-bronze-2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"><path d="M8 18V8H18M422 8H432V18M8 406V416H18M422 416H432V406"/></g><text x="220" y="27" text-anchor="middle" font-size="19" class="il-head" font-weight="700" fill="currentColor" stroke="none">图像预算三层口诀：分别核算</text><text x="220" y="49" text-anchor="middle" font-size="16" class="il-sub il-muted" fill="currentColor" stroke="none">编码器 patch 数 ≠ 连接器输出数 ≠ API 计费 token</text><g class="il-bronze-2"><path d="M20 60H211M229 60H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 56.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="22" y="72" width="396" height="70" rx="8" class="il-sky" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="22" y="72" width="396" height="70" rx="8" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><rect x="22" y="79" width="3.5" height="56" rx="1.7" class="il-sky" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="36" y="99" text-anchor="start" font-size="17" class="il-sky" font-weight="700" fill="currentColor" stroke="none">① 视觉编码器（patch 网格）</text><text x="36" y="125" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">1920×1080 p=16：原 8,160 → 缩边后 5,488</text><path pathLength="100" d="M220 142V170m-4.5 -5 4.5 5 4.5 -5" class="il-sky" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="170" width="396" height="70" rx="8" class="il-jade" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="22" y="170" width="396" height="70" rx="8" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><rect x="22" y="177" width="3.5" height="56" rx="1.7" class="il-jade" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="36" y="197" text-anchor="start" font-size="17" class="il-jade" font-weight="700" fill="currentColor" stroke="none">② 多模态连接器（压缩或重排）</text><text x="36" y="223" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">数千 patch 压成固定向量 (BLIP-2: 32 查询)</text><path pathLength="100" d="M220 240V268m-4.5 -5 4.5 5 4.5 -5" class="il-jade" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="268" width="396" height="70" rx="8" class="il-cinnabar" fill="currentColor" fill-opacity=".08" stroke="none"/><rect x="22" y="268" width="396" height="70" rx="8" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><rect x="22" y="275" width="3.5" height="56" rx="1.7" class="il-cinnabar" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="36" y="295" text-anchor="start" font-size="17" class="il-cinnabar" font-weight="700" fill="currentColor" stroke="none">③ 厂商 API 计费口径</text><text x="36" y="321" text-anchor="start" font-size="16" class="il-sub" fill="currentColor" stroke="none">按瓦片/公式算（教学 area/750：1844 / 442）</text><g class="il-bronze-2"><path d="M20 356H211M229 356H420" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M220 352.5l3.5 3.5-3.5 3.5-3.5-3.5Z" fill="currentColor" fill-opacity=".45" stroke="none"/></g><rect x="22" y="370" width="396" height="30" rx="15" class="il-cinnabar" fill="currentColor" fill-opacity=".12" stroke="none"/><rect x="22" y="370" width="396" height="30" rx="15" class="il-cinnabar" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity=".7"/><text x="220" y="390.1" text-anchor="middle" font-size="16" class="il-sub il-cinnabar" font-weight="700" fill="currentColor" stroke="none">勿把原始 patch 数代入账单，须查厂商计价页</text></svg>
